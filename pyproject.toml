[project]
name = "hwagae-jangnal-api"
version = "0.1.0"
description = "Local API development environment for Hwagae Jangnal"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8,<10",
]

[tool.uv]
package = false
required-version = ">=0.10.6"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
addopts = "-q"
