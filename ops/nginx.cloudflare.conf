# Production virtual host. Install separately; do not replace other sites.
# Requires the server's existing trusted Cloudflare CIDR snippets.
geo $realip_remote_addr $hwagae_from_cf {
    default 0;
    include /etc/nginx/snippets/cloudflare-ips.conf;
}

limit_req_zone $binary_remote_addr zone=hwagae_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name hwagae.milky.kr;
    if ($hwagae_from_cf = 0) { return 444; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hwagae.milky.kr;

    ssl_certificate /etc/hwagae/tls/origin.pem;
    ssl_certificate_key /etc/hwagae/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    if ($hwagae_from_cf = 0) { return 444; }

    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;

    location = /api/auth/login {
        limit_req zone=hwagae_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # AI fallback may use several providers within its 70-second budget.
        proxy_read_timeout 80s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
