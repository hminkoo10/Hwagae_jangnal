name: Verify and deploy

on:
  push:
    branches: [main, "feat/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected branch after verification
        type: boolean
        default: false
      verify_tft:
        description: Verify TFT on the Ubuntu ARM64 server without deploying
        type: boolean
        default: false
      tft_checkpoint:
        description: Existing checkpoint path under /srv/hwagae/shared
        type: string
        default: /srv/hwagae/shared/models/best-epoch=02-val_loss=3.9847.ckpt
      tft_checkpoint_asset_id:
        description: Optional private draft release asset ID for the existing checkpoint
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.6"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest --tb=short
      - name: Check deployment script syntax
        run: bash -n ops/deploy.sh ops/verify-tft.sh

  web:
    name: Web types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_DEMO_LOGIN_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  ml-preprocess:
    name: ML preprocessing tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.6"
          python-version: "3.11"
          enable-cache: true
      - run: uv venv --no-project --python 3.11 .model-venv
      - run: uv pip install --python .model-venv/bin/python numpy==2.1.3 pandas==2.2.3
      - run: .model-venv/bin/python -m py_compile ops/tft_worker.py
      # CI has no checkpoint. Real CPU inference is checked before server activation.
      - run: .model-venv/bin/python -m unittest discover -s ml/tests -p test_preprocess.py -v
      - run: .model-venv/bin/python -m unittest ml.tests.test_bridge ml.tests.test_evaluate ml.tests.test_samples -v

  deploy:
    name: Deploy Ubuntu
    needs: [api, web, ml-preprocess]
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && inputs.verify_tft != true && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: hwagae-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Transfer and deploy verified revision
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_KEY:?Missing DEPLOY_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          key_file="$RUNNER_TEMP/hwagae-key"
          hosts_file="$RUNNER_TEMP/hwagae-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          options=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts_file" -o ConnectTimeout=15)
          git archive --format=tar.gz --output="$RUNNER_TEMP/release.tar.gz" "$RELEASE_SHA"
          ssh "${options[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /srv/hwagae/incoming'
          scp "${options[@]}" -P "$port" "$RUNNER_TEMP/release.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/srv/hwagae/incoming/$RELEASE_SHA.tar.gz"
          ssh "${options[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $RELEASE_SHA" < ops/deploy.sh

  verify-tft:
    name: Verify TFT on Ubuntu ARM64
    needs: [api, web]
    if: github.event_name == 'workflow_dispatch' && inputs.verify_tft
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: hwagae-tft-verification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated verification and collect reports
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          VERIFY_SHA: ${{ github.sha }}
          TFT_CHECKPOINT: ${{ inputs.tft_checkpoint }}
          TFT_CHECKPOINT_ASSET_ID: ${{ inputs.tft_checkpoint_asset_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p tft-verification-reports
          stage=configuration
          key_file="$RUNNER_TEMP/tft-verify-key"
          hosts_file="$RUNNER_TEMP/tft-verify-known-hosts"
          model_file="$RUNNER_TEMP/tft-existing-checkpoint.ckpt"
          verification_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            result=$?
            trap - EXIT
            python3 - "$stage" "$result" "$verification_id" <<'PY'
          import json, pathlib, sys
          stage, code, verification_id = sys.argv[1:]
          pathlib.Path("tft-verification-reports/runner-status.json").write_text(json.dumps({
              "status": "passed" if int(code) == 0 else "failed", "stage": stage,
              "exit_code": int(code), "verification_id": verification_id,
          }, indent=2) + "\n")
          PY
            rm -f "$key_file" "$hosts_file" "$model_file"
            exit "$result"
          }
          trap cleanup EXIT
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_KEY:?Missing DEPLOY_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VERIFY_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -z "$TFT_CHECKPOINT_ASSET_ID" || "$TFT_CHECKPOINT_ASSET_ID" =~ ^[0-9]+$ ]]
          [[ -n "$TFT_CHECKPOINT_ASSET_ID" || "$TFT_CHECKPOINT" =~ ^/srv/hwagae/shared/[A-Za-z0-9_./=+-]+$ ]]
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          options=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts_file" -o ConnectTimeout=15)
          if [[ -n "$TFT_CHECKPOINT_ASSET_ID" ]]; then
            stage=checkpoint_download
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 180 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$TFT_CHECKPOINT_ASSET_ID" \
              --output "$model_file"
            expected_sha="$(python3 -c 'import json; print(json.load(open("ml/metadata/manifest.json"))["checkpoint_sha256"])')"
            [[ "$expected_sha" =~ ^[a-f0-9]{64}$ ]]
            printf '%s  %s\n' "$expected_sha" "$model_file" | sha256sum --check --status
            stage=checkpoint_transfer
            model_dir=/srv/hwagae/shared/models
            remote_model="$model_dir/walmart-e64b570d.ckpt"
            pending_model="$remote_model.part-$verification_id"
            ssh "${options[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "test \"\$(realpath -m '$model_dir')\" = '$model_dir' && mkdir -p '$model_dir'"
            scp "${options[@]}" -P "$port" "$model_file" "$DEPLOY_USER@$DEPLOY_HOST:$pending_model"
            ssh "${options[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "printf '%s  %s\\n' '$expected_sha' '$pending_model' | sha256sum --check --status && mv -f '$pending_model' '$remote_model'"
            TFT_CHECKPOINT="$remote_model"
          fi
          stage=source_transfer
          remote="/srv/hwagae/shared/tft-verification/$VERIFY_SHA"
          git archive --format=tar.gz --output="$RUNNER_TEMP/tft-source.tar.gz" "$VERIFY_SHA"
          ssh "${options[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "test \"\$(realpath -m '$remote')\" = '$remote' && mkdir -p '$remote'"
          scp "${options[@]}" -P "$port" "$RUNNER_TEMP/tft-source.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:$remote/source.tar.gz"
          result=0
          stage=remote_verification
          ssh "${options[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "TFT_VERIFICATION_ID='$verification_id' bash -s -- '$VERIFY_SHA' --checkpoint '$TFT_CHECKPOINT'" < ops/verify-tft.sh || result=$?
          stage=report_collection
          scp "${options[@]}" -r -P "$port" "$DEPLOY_USER@$DEPLOY_HOST:$remote/reports/." tft-verification-reports/ || {
            echo 'Could not retrieve verification reports.' >&2
            (( result != 0 )) || result=1
          }
          python3 - "$verification_id" "$VERIFY_SHA" "$result" <<'PY'
          import json, sys
          report = json.load(open("tft-verification-reports/status.json"))
          if report.get("verification_id") != sys.argv[1] or report.get("revision") != sys.argv[2]:
              raise SystemExit("Remote report belongs to a different verification attempt.")
          if int(sys.argv[3]) == 0 and (report.get("status") != "passed" or report.get("exit_code") != 0):
              raise SystemExit("Remote execution did not produce a passing verification report.")
          PY
          cat tft-verification-reports/status.json >> "$GITHUB_STEP_SUMMARY"
          stage=remote_failed
          (( result != 0 )) || stage=complete
          exit "$result"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tft-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: tft-verification-reports/
          if-no-files-found: warn
          retention-days: 14
