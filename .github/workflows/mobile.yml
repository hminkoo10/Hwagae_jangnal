name: Build mobile apps

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/mobile-admin/**"
      - "apps/web/**"
      - "scripts/mobile*"
      - "scripts/build-mobile.mjs"
      - "package.json"
      - "package-lock.json"
      - ".gitignore"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/mobile-admin/**"
      - "apps/web/**"
      - "scripts/mobile*"
      - "scripts/build-mobile.mjs"
      - "package.json"
      - "package-lock.json"
      - ".gitignore"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_BASE_URL: https://hwagae.milky.kr/api
  NEXT_PUBLIC_DEMO_LOGIN_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"

# Two installable apps: store (owners and staff, apps/mobile) and admin
# (service operators, apps/mobile-admin). Each job syncs both web bundles so
# mobile:check covers both, then builds only its own native project.
jobs:
  android:
    name: Android debug APK (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: store
            project: apps/mobile
            artifact: hwagae
          - app: admin
            project: apps/mobile-admin
            artifact: hwagae-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            apps/mobile*/android/**/*.gradle*
            apps/mobile*/android/gradle/wrapper/gradle-wrapper.properties
      - run: npm ci
      - run: npm run mobile:sync
      - run: npm run mobile:admin:sync
      - run: npm run mobile:check
      - name: Build installable test APK
        working-directory: ${{ matrix.project }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Save Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-android-debug
          path: ${{ matrix.project }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator and unsigned device builds (${{ matrix.app }})
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: store
            project: apps/mobile
            artifact: hwagae
            bundle_id: kr.milky.hwagae
            display_name: 화개장날
          - app: admin
            project: apps/mobile-admin
            artifact: hwagae-admin
            bundle_id: kr.milky.hwagae.admin
            display_name: 화개장날 관리자
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync
      - run: npm run mobile:admin:sync
      - run: npm run mobile:check
      - name: Build without an Apple signing identity
        run: |
          xcodebuild -version
          xcodebuild \
            -project "${{ matrix.project }}/ios/App/App.xcodeproj" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/Build/Products/Debug-iphonesimulator/App.app \
            "build/${{ matrix.artifact }}-ios-simulator.zip"
      - name: Save iOS simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-ios-simulator
          path: build/${{ matrix.artifact }}-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
      - name: Build unsigned iPhone and iPad app
        run: |
          xcodebuild \
            -project "${{ matrix.project }}/ios/App/App.xcodeproj" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned device IPA for local signing
        env:
          BUNDLE_ID: ${{ matrix.bundle_id }}
          DISPLAY_NAME: ${{ matrix.display_name }}
          IPA: build/${{ matrix.artifact }}-ios-unsigned.ipa
        run: |
          app="build/ios-device/Build/Products/Release-iphoneos/App.app"
          xcrun lipo "$app/App" -verify_arch arm64
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          app = Path("build/ios-device/Build/Products/Release-iphoneos/App.app")
          info = plistlib.loads((app / "Info.plist").read_bytes())
          assert info["CFBundleSupportedPlatforms"] == ["iPhoneOS"], "Device build required"
          assert info["CFBundleIdentifier"] == os.environ["BUNDLE_ID"]
          assert info["CFBundleDisplayName"] == os.environ["DISPLAY_NAME"]
          assert set(info["UIDeviceFamily"]) == {1, 2}, "Both iPhone and iPad must be supported"
          assert info["MinimumOSVersion"] == "16.4"
          assert (app / "public/index.html").is_file(), "Bundled frontend missing"
          assert not (app / "embedded.mobileprovision").exists(), "CI must not embed an account profile"
          PY
          mkdir -p build/ios-device-package/Payload
          ditto "$app" build/ios-device-package/Payload/App.app
          ditto -c -k --norsrc --keepParent \
            build/ios-device-package/Payload \
            "$IPA"
          unzip -t "$IPA"
      - name: Save unsigned iOS device IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-ios-unsigned
          path: build/${{ matrix.artifact }}-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
